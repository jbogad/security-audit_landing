<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            margin-top: 80px;
        }
        
        .profile-header {
            background: rgba(15, 20, 40, 0.8);
            border: 1px solid rgba(0, 255, 157, 0.2);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .avatar-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #00ff9d;
            background: rgba(0, 255, 157, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #00ff9d;
            font-weight: bold;
            margin: 0 auto 1rem;
        }
        
        .profile-section {
            background: rgba(15, 20, 40, 0.8);
            border: 1px solid rgba(0, 255, 157, 0.2);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        .btn-save {
            background: #00ff9d;
            color: #0a0e27;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-save:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    
    <!-- NAVIGATION -->
    <nav>
        <div class="container">
            <div class="logo"><a href="/" style="color: #00ff9d; text-decoration: none;">HackPrevent.es</a></div>
            <div class="nav-links">
                <button class="btn-login" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- PROFILE -->
    <div class="profile-container">
        
        <!-- HEADER -->
        <div class="profile-header">
            <div id="avatarDisplay" class="avatar-placeholder">U</div>
            <h2 id="usernameDisplay" style="color: #00ff9d; margin-bottom: 0.5rem;">Usuario</h2>
            <p id="emailDisplay" style="color: #b0b0b0;">email@example.com</p>
        </div>

        <!-- PERFIL -->
        <div class="profile-section">
            <h3 style="color: #00ff9d; margin-bottom: 1.5rem;">
                <i class="fas fa-user"></i> Mi Perfil
            </h3>
            
            <form id="personalInfoForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="fullName">
                    </div>
                    <div class="form-group">
                        <label>Sitio Web</label>
                        <input type="url" id="website">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="bio" rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Avatar URL</label>
                    <input type="url" id="avatarUrl">
                </div>
                
                <button type="submit" class="btn-save">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </form>
        </div>

        <!-- REDES SOCIALES -->
        <div class="profile-section">
            <h3 style="color: #00ff9d; margin-bottom: 1.5rem;">
                <i class="fas fa-share-alt"></i> Redes Sociales
            </h3>
            
            <form id="socialLinksForm">
                <div class="form-group">
                    <label><i class="fab fa-github"></i> GitHub</label>
                    <input type="url" id="githubUrl" placeholder="https://github.com/usuario">
                </div>
                
                <div class="form-group">
                    <label><i class="fab fa-twitter"></i> Twitter</label>
                    <input type="url" id="twitterUrl" placeholder="https://twitter.com/usuario">
                </div>
                
                <div class="form-group">
                    <label><i class="fab fa-linkedin"></i> LinkedIn</label>
                    <input type="url" id="linkedinUrl" placeholder="https://linkedin.com/in/usuario">
                </div>
                
                <button type="submit" class="btn-save">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </form>
        </div>

        <!-- CONTRASEÑA -->
        <div class="profile-section">
            <h3 style="color: #00ff9d; margin-bottom: 1.5rem;">
                <i class="fas fa-lock"></i> Cambiar Contraseña
            </h3>
            
            <form id="changePasswordForm">
                <div class="form-group">
                    <label>Nueva Contraseña</label>
                    <input type="password" id="newPassword" required minlength="6" placeholder="Mínimo 6 caracteres">
                </div>
                
                <div class="form-group">
                    <label>Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" required minlength="6" placeholder="Repite tu contraseña">
                </div>
                
                <button type="submit" class="btn-save">
                    <i class="fas fa-shield-alt"></i> Cambiar Contraseña
                </button>
            </form>
        </div>

    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
// Inline Auth Module (same as index.html)
let sb = null;
async function getClient() {
    if (sb) return sb;
    for (let i = 0; i < 50; i++) {
        if (window.supabase) {
            sb = window.supabase.createClient(
                'https://sdudrliwounfknjiwsgb.supabase.co',
                'sb_publishable_QKSOaxQE05LKoSpraT4seg_aFvDBLLO'
            );
            return sb;
        }
        await new Promise(r => setTimeout(r, 100));
    }
}
async function loginUser(email, password) {
    const client = await getClient();
    if (!client) return { success: false, message: 'Connection error' };
    try {
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) return { success: false, message: 'Credenciales incorrectas' };
        localStorage.setItem('supabase_session', JSON.stringify(data.session));
        return { success: true, message: '¡Bienvenido!' };
    } catch (e) {
        return { success: false, message: e.message };
    }
}
async function registerUser(username, email, password, confirmPassword) {
    if (password !== confirmPassword) return { success: false, message: 'Las contraseñas no coinciden' };
    const client = await getClient();
    if (!client) return { success: false, message: 'Connection error' };
    try {
        const { data, error } = await client.auth.signUp({
            email, password,
            options: { data: { username } }
        });
        if (error) return { success: false, message: error.message };
        return { success: true, message: '¡Cuenta creada!' };
    } catch (e) {
        return { success: false, message: e.message };
    }
}
async function logoutUser() {
    const client = await getClient();
    if (client) await client.auth.signOut();
    localStorage.removeItem('supabase_session');
    return { success: true };
}
async function requestPasswordReset(email) {
    const client = await getClient();
    if (!client) return { success: false, message: 'Connection error' };
    try {
        const { error } = await client.auth.resetPasswordForEmail(email);
        return error ? { success: false, message: error.message } : { success: true, message: 'Email enviado' };
    } catch (e) {
        return { success: false, message: e.message };
    }
}
async function getCurrentUser() {
    const client = await getClient();
    if (!client) return { success: false, user: null };
    try {
        // Intentar recuperar del Supabase client primero
        const { data: { user } } = await client.auth.getUser();
        if (user) {
            return { success: true, user };
        }
        
        // Si no hay usuario, intentar recuperar la sesión del localStorage
        const sessionStr = localStorage.getItem('supabase_session');
        if (sessionStr) {
            try {
                const session = JSON.parse(sessionStr);
                if (session && session.user) {
                    return { success: true, user: session.user };
                }
            } catch (e) {
                console.log('Error parsing saved session');
            }
        }
        
        return { success: false, user: null };
    } catch (e) {
        // Intentar recuperar del localStorage si hay error
        const sessionStr = localStorage.getItem('supabase_session');
        if (sessionStr) {
            try {
                const session = JSON.parse(sessionStr);
                if (session && session.user) {
                    return { success: true, user: session.user };
                }
            } catch (err) {
                console.log('Error parsing saved session');
            }
        }
        return { success: false, user: null };
    }
}
async function getUserProfile(userId) {
    const client = await getClient();
    if (!client) return { success: false, profile: null };
    try {
        const { data } = await client.from('profiles').select('*').eq('id', userId).single();
        return { success: true, profile: data };
    } catch (e) {
        return { success: false, profile: null };
    }
}
async function updateProfile(userId, updates) {
    const client = await getClient();
    if (!client) return { success: false, message: 'Connection error' };
    try {
        const { data, error } = await client.from('profiles').update(updates).eq('id', userId).select().single();
        if (error) return { success: false, message: error.message };
        return { success: true, message: 'Perfil actualizado', profile: data };
    } catch (e) {
        return { success: false, message: e.message };
    }
}
async function changePassword(newPassword, confirmPassword) {
    if (newPassword !== confirmPassword) return { success: false, message: 'Las contraseñas no coinciden' };
    if (newPassword.length < 6) return { success: false, message: 'La contraseña debe tener al menos 6 caracteres' };
    
    const client = await getClient();
    if (!client) return { success: false, message: 'Connection error' };
    try {
        const { error } = await client.auth.updateUser({ password: newPassword });
        if (error) return { success: false, message: error.message };
        return { success: true, message: 'Contraseña actualizada' };
    } catch (e) {
        return { success: false, message: e.message };
    }
}
window.supabaseAuth = { loginUser, registerUser, logoutUser, getCurrentUser, requestPasswordReset, getUserProfile, updateProfile, changePassword };
    </script>
    <script src="js/script.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
