<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            margin-top: 80px;
        }
        
        .profile-header {
            background: rgba(15, 20, 40, 0.8);
            border: 1px solid rgba(0, 255, 157, 0.2);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .avatar-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #00ff9d;
            background: rgba(0, 255, 157, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #00ff9d;
            font-weight: bold;
            margin: 0 auto 1rem;
        }
        
        .profile-section {
            background: rgba(15, 20, 40, 0.8);
            border: 1px solid rgba(0, 255, 157, 0.2);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        .btn-save {
            background: #00ff9d;
            color: #0a0e27;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-save:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    
    <!-- NAVIGATION -->
    <nav>
        <div class="container">
            <div class="logo"><a href="/" style="color: #00ff9d; text-decoration: none;">HackPrevent.es</a></div>
            <div class="nav-links">
                <button class="btn-login" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- PROFILE -->
    <div class="profile-container">
        
        <!-- HEADER -->
        <div class="profile-header">
            <div id="avatarDisplay" class="avatar-placeholder">U</div>
            <h2 id="usernameDisplay" style="color: #00ff9d; margin-bottom: 0.5rem;">Usuario</h2>
            <p id="emailDisplay" style="color: #b0b0b0;">email@example.com</p>
        </div>

        <!-- PERFIL -->
        <div class="profile-section">
            <h3 style="color: #00ff9d; margin-bottom: 1.5rem;">
                <i class="fas fa-user"></i> Mi Perfil
            </h3>
            
            <form id="personalInfoForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="fullName">
                    </div>
                    <div class="form-group">
                        <label>Sitio Web</label>
                        <input type="url" id="website">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="bio" rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Avatar URL</label>
                    <input type="url" id="avatarUrl">
                </div>
                
                <button type="submit" class="btn-save">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </form>
        </div>

        <!-- REDES SOCIALES -->
        <div class="profile-section">
            <h3 style="color: #00ff9d; margin-bottom: 1.5rem;">
                <i class="fas fa-share-alt"></i> Redes Sociales
            </h3>
            
            <form id="socialLinksForm">
                <div class="form-group">
                    <label><i class="fab fa-github"></i> GitHub</label>
                    <input type="url" id="githubUrl" placeholder="https://github.com/usuario">
                </div>
                
                <div class="form-group">
                    <label><i class="fab fa-twitter"></i> Twitter</label>
                    <input type="url" id="twitterUrl" placeholder="https://twitter.com/usuario">
                </div>
                
                <div class="form-group">
                    <label><i class="fab fa-linkedin"></i> LinkedIn</label>
                    <input type="url" id="linkedinUrl" placeholder="https://linkedin.com/in/usuario">
                </div>
                
                <button type="submit" class="btn-save">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </form>
        </div>

        <!-- CONTRASEÑA -->
        <div class="profile-section">
            <h3 style="color: #00ff9d; margin-bottom: 1.5rem;">
                <i class="fas fa-lock"></i> Cambiar Contraseña
            </h3>
            
            <form id="changePasswordForm">
                <div class="form-group">
                    <label>Nueva Contraseña</label>
                    <input type="password" id="newPassword" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label>Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" required minlength="6">
                </div>
                
                <button type="submit" class="btn-save">
                    <i class="fas fa-shield-alt"></i> Cambiar
                </button>
            </form>
        </div>

    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>

                            <input type="text" id="fullName" placeholder="Tu nombre completo">
                        </div>
                        <div class="form-group">
                            <label for="avatarUrl"><i class="fas fa-image"></i> URL del Avatar</label>
                            <input type="url" id="avatarUrl" placeholder="https://ejemplo.com/avatar.jpg">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="bio"><i class="fas fa-align-left"></i> Biografía</label>

                    </div>
                    
                    <div class="form-group">
                        <label for="website"><i class="fas fa-globe"></i> Sitio Web</label>
                        <input type="url" id="website" placeholder="https://tu-sitio.com">
                    </div>
                    
                    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                        <button type="button" class="btn-cancel" onclick="loadUserProfile()">
                            <i class="fas fa-undo"></i> Cancelar
                        </button>
                        <button type="submit" class="btn-save">
                            <i class="fas fa-save"></i> Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>

            <!-- Social Links Section -->
            <div class="profile-section">
                <h2 class="section-title">
                    <i class="fas fa-share-alt"></i> Redes Sociales
                </h2>
                
                <form id="socialLinksForm" class="form-grid">
                    <div class="social-links">
                        <div class="social-input">
                            <i class="fab fa-github"></i>
                            <input type="text" id="githubUrl" placeholder="tu-usuario" style="flex: 1;">
                        </div>
                        <div class="social-input">
                            <i class="fab fa-twitter"></i>
                            <input type="text" id="twitterUrl" placeholder="@tu-usuario" style="flex: 1;">
                        </div>
                        <div class="social-input">
                            <i class="fab fa-linkedin"></i>
                            <input type="text" id="linkedinUrl" placeholder="tu-perfil" style="flex: 1;">
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                        <button type="submit" class="btn-save">
                            <i class="fas fa-save"></i> Guardar Enlaces
                        </button>
                    </div>
                </form>
            </div>

            <!-- Security Section -->
            <div class="profile-section">
                <h2 class="section-title">
                    <i class="fas fa-lock"></i> Seguridad
                </h2>
                
                <form id="changePasswordForm" class="form-grid">
                    <div class="form-group">
                        <label for="newPassword"><i class="fas fa-key"></i> Nueva Contraseña</label>
                        <input type="password" id="newPassword" placeholder="Mínimo 8 caracteres">
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmPassword"><i class="fas fa-key"></i> Confirmar Contraseña</label>
                        <input type="password" id="confirmPassword" placeholder="Repite la contraseña">
                    </div>
                    
                    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                        <button type="submit" class="btn-save">
                            <i class="fas fa-shield-alt"></i> Cambiar Contraseña
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
