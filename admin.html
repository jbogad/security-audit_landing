<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            margin-top: 80px;
        }
        .admin-header {
            background: rgba(15, 20, 40, 0.8);
            border: 1px solid rgba(255, 51, 102, 0.5);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .users-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: rgba(15, 20, 40, 0.8);
            border-radius: 10px;
            overflow: hidden;
        }
        .users-table th, .users-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .users-table th {
            background: rgba(255, 51, 102, 0.2);
            color: #ff3366;
        }
        .btn-action {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 0.3rem 0.8rem;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 0.5rem;
        }
        .btn-action.add { border-color: #00ff9d; color: #00ff9d; }
        .btn-action.sub { border-color: #ff3366; color: #ff3366; }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <div class="logo"><a href="/" style="color: #ff3366; text-decoration: none;">HackPrevent <span style="font-size: 0.8em;">(ADMIN)</span></a></div>
            <div class="nav-links">
                <button class="btn-login" onclick="window.location.href='/'">Volver a Inicio</button>
            </div>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h2 style="color: #ff3366; margin-bottom: 0.5rem;"><i class="fas fa-user-shield"></i> Panel de Administración</h2>
            <p style="color: #b0b0b0;">Gestiona los usuarios, su experiencia y su progreso en los laboratorios.</p>
        </div>

        <div class="lab-section" style="display: block;">
            <h3 style="color: #00ff9d;"><i class="fas fa-users"></i> Lista de Usuarios</h3>
            <table class="users-table">
                <thead>
                    <tr>
                        <th>Email / Nombre</th>
                        <th>XP Total</th>
                        <th>Códigos Canjeados</th>
                        <th>Acciones XP</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <tr><td colspan="4" style="text-align: center;">Cargando usuarios...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js?v=3"></script>
    <script src="js/admin.js?v=3"></script>
</body>
</html>
